# Render Blueprint: deploys Luminary as a password-protected website.
# In Render: New + > Blueprint > pick this repository. You'll be asked for
# ANTHROPIC_API_KEY and LUMINARY_PASSWORD.
services:
  - type: web
    name: luminary
    runtime: node
    # "free" costs nothing, but the app sleeps when idle and anything you save
    # is lost whenever it restarts. To keep your data, switch to "starter"
    # (paid) and add a disk mounted at /var/data with LUMINARY_DATA pointing
    # to /var/data/db.json.
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LUMINARY_PASSWORD
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: NODE_VERSION
        value: "22"
